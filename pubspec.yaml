name: elecapp_entreprise
description: "Elecapp — Espace Gérant d'Entreprise"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.3

  # State management
  provider: ^6.1.2

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # Sécurité
  crypto: ^3.0.6
  email_validator: ^2.1.17

  # UX
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.3.0
  logger: ^2.5.0

  # Backend Supabase
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0

  # Utils
  url_launcher: ^6.3.1
  intl: ^0.19.0

  # Data classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"
  min_sdk_android: 21
  adaptive_icon_background: "#15803D"
  adaptive_icon_foreground: "assets/images/logo1.png"

flutter_native_splash:
  color: "#15803D"
  color_dark: "#15803D"
  image: assets/images/logo1.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
